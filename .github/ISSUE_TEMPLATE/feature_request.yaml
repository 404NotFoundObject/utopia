name: 💡 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！

  - type: textarea
    id: problem
    attributes:
      label: 这个功能解决什么问题？
      description: 描述你遇到的实际困难或场景
      placeholder: 我在使用 xxx 时，总是需要……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 描述你希望 Utopia 如何实现这个功能
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他实现方式（可选）
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已经搜索过现有 Issue，没有找到相同建议
          required: true
        - label: 这个功能符合项目的设计定位（AI 角色扮演 Agent）
          required: true