name: 🐛 Bug 报告
description: 报告一个缺陷，帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告问题！
        提交前请先搜索现有 Issue，避免重复。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述这个 bug 是什么
      placeholder: 我在使用 xxx 功能时遇到了……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步一步描述如何复现这个问题
      placeholder: |
        1. 打开 xxx 页面
        2. 点击 xxx 按钮
        3. 观察到 xxx
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器
      placeholder: Chrome 120 / Edge 120 / Firefox 121 / Safari 17
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 / macOS 14 / Ubuntu 22.04 / Android 14 / iOS 17
    validations:
      required: true

  - type: textarea
    id: console-log
    attributes:
      label: 控制台日志
      description: F12 → Console 面板的完整输出
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如果涉及 UI 问题，请附上截图
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已经搜索过现有 Issue，没有找到相同问题
          required: true
        - label: 我已经阅读过 README 和 FAQ
          required: true